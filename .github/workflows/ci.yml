name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Smoke-test the CLI
        run: |
          cachesim gen-traces --out-dir traces sequential conflict
          cachesim run --check traces/sequential.trace --config configs/default.json
          cachesim run --format json --config configs/prefetch_stride.json traces/conflict.trace > /dev/null
          cachesim trace-stats traces/conflict.trace
          cachesim sweep --size 8192 traces/conflict.trace
          # No --values: the default policy list must be one this can run.
          cachesim sweep --param policy --no-plot traces/conflict.trace
          cachesim policies --size 8k traces/conflict.trace
          cachesim mrc traces/conflict.trace --sets 64 --block-size 1k
          cachesim compare traces/conflict.trace --config default --config configs/victim_cache.json
          cachesim sets traces/conflict.trace --size 4k --assoc 1
          cachesim bench traces/conflict.trace --repeat 1

  lint:
    name: lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
