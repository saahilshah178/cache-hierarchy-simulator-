[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cachesim"
version = "1.0.1"
description = "Trace-driven cache and memory-hierarchy simulator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Saahil Shah"}]
keywords = ["cache", "simulator", "computer-architecture", "memory-hierarchy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Hardware",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
dev = ["pytest>=7", "hypothesis>=6", "ruff>=0.4", "mypy>=1.8", "matplotlib>=3.5"]

[project.scripts]
cachesim = "cachesim.cli:main"

[project.urls]
Repository = "https://github.com/saahilshah178/cache-hierarchy-simulator-"

[tool.setuptools]
packages = ["cachesim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No -q here. It is not a hidden baseline worth having: a caller who adds
# their own -q (as every doc snippet and CI log does) would reach verbosity
# -2, at which pytest prints the progress dots and no "N passed in T s"
# summary at all -- which is how a newly skipped test or a creeping runtime
# stays invisible in a green log.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["cachesim"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["cachesim", "tests"]

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
